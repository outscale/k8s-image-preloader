name: e2e_test

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "**.sh"
      - "Dockerfile"
      - "Makefile"
      - "go.*"
      - ".github/workflows/e2e_test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, local]
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: ⬇️ Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: 🐳 Login to Harbor
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ vars.REGISTRY }}
        username: ${{ secrets.HARBOR_USER }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    - name: 📦 Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: 'v2.15.4'
        args: release --clean --snapshot
    - name: 📦  Push the Docker image
      run: |
        make image-tag image-push
      env:
        IMAGE: "outscale/k8s-image-preloader"
        IMAGE_TAG: dev-amd64
        REGISTRY_IMAGE: "${{ vars.REGISTRY }}/outscale/k8s-image-preloader"
        REGISTRY_TAG: ${{ github.sha }}
  e2e:
    strategy:
      matrix:
        img_kubernetes: ${{ fromJson(vars.IMG_KUBERNETES_MATRIX) }}
    runs-on: [self-hosted, linux, kube]
    needs: build
    permissions:
      id-token: write
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      with:
        version: v1.32.9
    - name: ⬇️ Install helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.1
    - name: 🧹 Frieza
      id: secrets
      uses: outscale/.github/vault-frieza-clean@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      with:
        vault_role: outscale-k8s-image-preloader
        exclude_resource_types: access_key
    - name: ⬇️ Install octl
      uses: outscale/octl/.github/actions/setup_octl@b5e8714f317ca1625a4a4a8705c649d90bac4f72 # v0.0.34
      with:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
    - name: 👷 Deploy test cluster
      id: caposc
      uses: outscale/.github/kube-setup@cc76c3e03f3c7a83a09914b1ed65b7fea5605fb8 # v1.5.1
      timeout-minutes: 40
      with:
        OSC_REGION: ${{ steps.secrets.outputs.region }}
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
        IMAGE_NAME: ${{ matrix.img_kubernetes }}
        CCM: true
        ALLOW_FROM: ${{ vars.ALLOW_FROM }}
        vault_role: outscale-k8s-image-preloader
        vault_token: ${{ steps.secrets.outputs.vault_token }}
        PRELOADER_SNAPSHOT: true
        PRELOADER_IMAGE: ${{ vars.REGISTRY }}/outscale/k8s-image-preloader
        PRELOADER_VERSION: ${{ github.sha }}
    - name: 🔎 Check success
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          console.log(`SNAPSHOT_ID: ${process.env.SNAPSHOT_ID}`);
          if (process.env.SNAPSHOT_ID == "") {
            core.setFailed(`No snapshot found !`);
          }
      env:
        SNAPSHOT_ID: ${{ steps.caposc.outputs.SNAPSHOT_ID}}
